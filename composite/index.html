<!doctype html>
<meta charset="utf-8">
<title>Composite tests</title>
<h1>Composite tests</h1>
<p id="summary">Open the browser console for grouped results.</p>
<script type="module">
  function runTests(tests) {
    function printGroup(group, results) {
      results.every(result => result.passed) ?
        console.groupCollapsed(group) :
        console.group(group);
      for (let { test, passed, error } of results)
        passed ?
          console.log("PASS —", test) :
          console.error("FAIL —", test, error || "Callback did not return true.");
      console.groupEnd();
    }

    const results = Object.entries(tests).map(([group, cases]) => {
      const groupResults = Object.entries(cases).map(([test, run]) => {
        try {
          return { test, passed: run() === true };
        } catch (caught) {
          return { test, error: String(caught) };
        }
      });
      printGroup(group, groupResults);
      return groupResults;
    }).flat();

    const failed = results.filter(result => !result.passed).length;
    const summary = `Tests finished: ${results.length - failed} passed, ${failed} failed.`;
    document.querySelector("#summary").textContent = summary;
    console.log(summary);
    console.log(results);
  }

  import { Composite, WeakHashMap } from "../composite.js";

  function throws(run, ErrorType = TypeError) {
    try {
      run();
      return false;
    } catch (error) {
      return error instanceof ErrorType;
    }
  }

  const tests = {
    "Primitives as values": {
      "null": () =>
        Object.is(Composite(null), null) && Composite.is(null) && Composite({ value: null }).value === null,
      "undefined": () =>
        Object.is(Composite(undefined), undefined) && Composite.is(undefined) && Composite({ value: undefined }).value === undefined,
      "null !== undefined": () =>
        Composite(null) !== Composite(undefined),
      "true": () =>
        Object.is(Composite(true), true) && Composite.is(true) && Composite({ value: true }).value === true,
      "false": () =>
        Object.is(Composite(false), false) && Composite.is(false) && Composite({ value: false }).value === false,
      "\"Alice\"": () =>
        Object.is(Composite("Alice"), "Alice") && Composite.is("Alice") && Composite({ value: "Alice" }).value === "Alice",
      '""': () =>
        Object.is(Composite(""), "") && Composite.is("") && Composite({ value: "" }).value === "",
      "42": () =>
        Object.is(Composite(42), 42) && Composite.is(42) && Composite({ value: 42 }).value === 42,
      "1.5": () =>
        Object.is(Composite(1.5), 1.5) && Composite.is(1.5) && Composite({ value: 1.5 }).value === 1.5,
      "42n": () =>
        Object.is(Composite(42n), 42n) && Composite.is(42n) && Composite({ value: 42n }).value === 42n,
      "0": () =>
        Object.is(Composite(0), 0) && Composite.is(0) && Object.is(Composite({ value: 0 }).value, 0),
      "-0": () =>
        Object.is(Composite(-0), -0) && Composite.is(-0) && Object.is(Composite({ value: -0 }).value, -0),
      "NaN": () =>
        Object.is(Composite(NaN), NaN) && Composite.is(NaN) && Object.is(Composite({ value: NaN }).value, NaN),
      "Infinity": () =>
        Object.is(Composite(Infinity), Infinity) && Composite.is(Infinity) && Object.is(Composite({ value: Infinity }).value, Infinity),
      "-Infinity": () =>
        Object.is(Composite(-Infinity), -Infinity) && Composite.is(-Infinity) && Object.is(Composite({ value: -Infinity }).value, -Infinity),
      "Symbol(\"local\")": () => {
        const value = Symbol("local");
        return Object.is(Composite(value), value) && Composite.is(value) && Composite({ value }).value === value;
      },
      "Symbol.for(\"\")": () => {
        const value = Symbol.for("");
        return Object.is(Composite(value), value) && Composite.is(value) && Composite({ value }).value === value;
      },
    },

    "Type and property distinctions": {
      "{} consume": () => {
        const a = {}, b = {}, A = Composite(a, true), B = Composite(b, true);
        return a === A && A === B && a !== b && A !== b;
      },
      "{}": () => {
        const a = {}, b = {}, A = Composite(a), B = Composite(b);
        return A === B && a !== b && A !== a && A !== b;
      },
      "[] consume": () => {
        const a = [], b = [], A = Composite(a, true), B = Composite(b, true);
        return a === A && A === B && a !== b && A !== b;
      },
      "[]": () => {
        const a = [], b = [], A = Composite(a), B = Composite(b);
        return A === B && a !== b && A !== a && A !== b;
      },
      "Composite({}) !== Composite([])": () => {
        return Composite({}) !== Composite([]);
      },
      "Composite({}) !==  Composite({ x: undefined })": () => {
        const missing = Composite({});
        const present = Composite({ x: undefined });
        if (missing === present) return false;
        if (Object.hasOwn(missing, "x")) return false;
        if (!Object.hasOwn(present, "x")) return false;
        return present.x === undefined;
      },
      // "{} and { x: undefined } remain distinct with consume = true": () => {
      //   const missing = Composite({}, true);
      //   const present = Composite({ x: undefined }, true);
      //   if (missing === present) return false;
      //   if (Object.hasOwn(missing, "x")) return false;
      //   if (!Object.hasOwn(present, "x")) return false;
      //   return present.x === undefined;
      // },
      "Primitive types remain distinct inside objects": () => {
        const number = Composite({ value: 1 });
        const string = Composite({ value: "1" });
        const bigint = Composite({ value: 1n });
        const nil = Composite({ value: null });
        const missing = Composite({ value: undefined });
        const no = Composite({ value: false });
        const yes = Composite({ value: true });
        const zero = Composite({ value: 0 });
        const empty = Composite({ value: "" });
        return new Set([number, string, bigint, nil, missing, no, yes, zero, empty]).size === 9;
      },
    },

    "Objects and children": {
      'Composite({ name: "Alice" }) === Composite({ name: "Alice" })': () =>
        Composite({ name: "Alice" }) === Composite({ name: "Alice" }),
      'Composite({ name: "Alice" }) !== Composite({ name: "Bob" })': () =>
        Composite({ name: "Alice" }) !== Composite({ name: "Bob" }),
      "Composite.is(result) is true and Composite(result) returns the same object": () => {
        const value = Composite({ name: "Alice" });
        return Composite.is(value) && Composite(value) === value;
      },
      "Equal children are shared across different parents": () => {
        const a = Composite({ id: 1, user: { name: "Alice" } });
        const b = Composite({ id: 2, user: { name: "Alice" } });
        return a !== b && a.user === b.user;
      },
      "An identical nested tree reuses its root": () =>
        Composite({ user: { name: "Alice" }, tags: ["js", "web"] }) ===
        Composite({ user: { name: "Alice" }, tags: ["js", "web"] }),
      "A shared child is not a cycle": () => {
        const child = { sharedChild: 1 };
        const result = Composite({ a: child, b: child });
        return result.a === result.b;
      },
      'Composite({ a: 1, b: 2 }) !== Composite({ b: 2, a: 1 })': () =>
        Composite({ a: 1, b: 2 }) !== Composite({ b: 2, a: 1 }),
      "Null-prototype data and plain objects are treated as equal": () =>
        Composite(Object.assign(Object.create(null), { prototypeExample: 1 })) === Composite({ prototypeExample: 1 }),
    },

    "Arrays": {
      "Equal arrays share a real array": () => {
        const a = Composite([1, 2, 3]);
        return Array.isArray(a) && Composite.is(a) && a === Composite([1, 2, 3]) && Composite(a) === a;
      },
      "[\"js\", \"web\"] and [\"web\", \"js\"] remain distinct": () =>
        Composite(["js", "web"]) !== Composite(["web", "js"]),
      "new Array(1) and [undefined] remain distinct": () =>
        Composite(new Array(1)) !== Composite([undefined]),
      "new Array(3) and new Array(4) preserve lengths and remain distinct": () => {
        const a = Composite(new Array(3));
        const b = Composite(new Array(4));
        return a !== b && a.length === 3 && b.length === 4 && !(0 in a);
      },
      "Trailing holes survive cloning": () => {
        const input = [1];
        input.length = 4;
        const result = Composite(input);
        return result.length === 4 && !(3 in result) && result !== Composite([1]);
      },
    },

    "Cloning and freezing": {
      "Inputs and their children stay separate and mutable": () => {
        const child = { cloningExample: 1 };
        const input = { child };
        const result = Composite(input);
        return result !== input && result.child !== child && input.child === child &&
          !Object.isFrozen(input) && !Object.isFrozen(child) &&
          Object.isFrozen(result) && Object.isFrozen(result.child);
      },
      "Empty inputs are cloned without freezing them": () => {
        const input = {};
        return Composite(input) !== input && !Object.isFrozen(input);
      },
      "Writing to a frozen child throws": () => {
        const result = Composite({ user: { name: "Carol" } });
        return throws(() => { result.user.name = "Changed"; }) && result.user.name === "Carol";
      },
      "Frozen input data can be cloned": () => {
        const input = Object.freeze({ child: Object.freeze({ frozenExample: 1 }) });
        const result = Composite(input);
        return result !== input && result.child !== input.child && Composite.is(result) && !Composite.is(input);
      },
      "Hidden property values are copied and participate in equality": () => {
        const child = { hiddenChild: 1 };
        const input = Object.defineProperty({ hiddenExample: 1 }, "hidden", { value: child });
        const result = Composite(input);
        return Object.hasOwn(result, "hidden") && result.hidden !== child &&
          Object.isFrozen(result.hidden) && !Object.isFrozen(child) &&
          result !== Composite({ hiddenExample: 1 });
      },
    },

    "Updates": {
      "Changed branches are replaced and untouched branches shared": () => {
        const before = Composite({ user: { name: "Alice" }, tags: ["js"] });
        const after = Composite({ ...before, user: { ...before.user, name: "Bob" } });
        return after !== before && after.user !== before.user && after.tags === before.tags &&
          before.user.name === "Alice" && after.user.name === "Bob";
      },
      "An equal update reuses its root": () => {
        const before = Composite({ user: { name: "Alice" } });
        return Composite({ ...before, user: { ...before.user } }) === before;
      },
    },


    "rawSet": {
      "Replaces only the changed branch and freezes the result": () => {
        const root = Composite({ user: { name: "Alice" }, tags: ["js"] });
        const result = Composite.rawSet(root, ["user", "name"], "Bob");
        return result === Composite({ user: { name: "Bob" }, tags: ["js"] }) &&
          result !== root && result.user !== root.user && result.tags === root.tags &&
          root.user.name === "Alice" && Object.isFrozen(result) && Object.isFrozen(result.user);
      },
      "An equal replacement reuses the root": () => {
        const root = Composite({ user: { name: "Alice" } });
        return Composite.rawSet(root, ["user"], { name: "Alice" }) === root;
      },
      "Creates missing objects and arrays from string indices": () =>
        Composite.rawSet(Composite({}), ["users", "0", "name"], "Alice") ===
        Composite({ users: [{ name: "Alice" }] }),
      "Numeric indices create the same arrays as string indices": () => {
        const root = Composite({});
        return Composite.rawSet(root, ["users", 0, "name"], "Alice") ===
          Composite.rawSet(root, ["users", "0", "name"], "Alice");
      },
      "Non-index strings create objects": () =>
        ["01", "-1", "1.5", "4294967295", ""].every(key => {
          const result = Composite.rawSet(undefined, [key], 1);
          return !Array.isArray(result) && result[key] === 1;
        }),
      "Replaces primitive roots and intermediate values with containers": () =>
        [null, undefined, false, 0, "text", 1n, Symbol("root")].every(value =>
          Composite.rawSet(value, ["child", "value"], 2) === Composite({ child: { value: 2 } }) &&
          Composite.rawSet(Composite({ child: value }), ["child", "value"], 2) ===
            Composite({ child: { value: 2 } })),
      "Supports symbol and empty-string path keys without changing the path": () => {
        const key = Symbol("path");
        const path = Object.freeze([key, ""]);
        const result = Composite.rawSet(Composite({}), path, 3);
        return result[key][""] === 3 && path.length === 2 && path[0] === key && path[1] === "";
      },
      "Clones supplied values by default": () => {
        const value = { child: { marker: Symbol("raw clone") } };
        const result = Composite.rawSet(Composite({}), ["value"], value);
        return result.value !== value && result.value.child !== value.child &&
          Object.isFrozen(result.value.child) && !Object.isFrozen(value) && !Object.isFrozen(value.child);
      },
      "Consumes supplied values when requested": () => {
        const value = { child: { marker: Symbol("raw consume") } };
        const result = Composite.rawSet(Composite({}), ["value"], value, true);
        return result.value === value && Object.isFrozen(value) && Object.isFrozen(value.child);
      },
      "Reuses already composite values": () => {
        const value = Composite({ marker: Symbol("raw shared") });
        return Composite.rawSet(Composite({}), ["value"], value).value === value;
      },
      "Distinguishes setting undefined from deleting a property": () => {
        const root = Composite({ value: 1, keep: 2 });
        const present = Composite.rawSet(root, ["value"], undefined);
        const removed = Composite.rawSet(root, ["value"], Composite.delete);
        return Object.hasOwn(present, "value") && present.value === undefined &&
          !Object.hasOwn(removed, "value") && removed.keep === 2 && root.value === 1;
      },
      "Deleting an absent property on an existing parent is a no-op": () => {
        const root = Composite({ child: { keep: 1 } });
        return Composite.rawSet(root, ["child", "missing"], Composite.delete) === root;
      },
      "Deletes symbol properties": () => {
        const key = Symbol("delete");
        const root = Composite({ [key]: 1 });
        return !Object.hasOwn(Composite.rawSet(root, [key], Composite.delete), key) && root[key] === 1;
      },
      "Deleting an array element leaves a hole and preserves length": () => {
        const root = Composite({ items: [1, 2, 3] });
        const result = Composite.rawSet(root, ["items", 1], Composite.delete);
        return result.items.length === 3 && !(1 in result.items) && result.items[2] === 3 && root.items[1] === 2;
      },
      "Array updates preserve trailing holes and extra properties": () => {
        const key = Symbol("array metadata");
        const items = [1];
        items.length = 4;
        items[key] = { marker: Symbol("metadata") };
        const root = Composite(items);
        const result = Composite.rawSet(root, [0], 2);
        return Array.isArray(result) && result.length === 4 && !(3 in result) &&
          result[key] === root[key] && root[0] === 1 && result[0] === 2;
      },
      //should we preserve non-enumerable properties on consumed composites?
      "Updates preserve non-enumerable data on consumed composites": () => {
        const input = Object.defineProperty({ value: 1 }, "hidden", {
          value: Symbol("hidden data"), enumerable: false,
        });
        const root = Composite(input, true);
        const result = Composite.rawSet(root, ["value"], 2);
        return Object.hasOwn(result, "hidden") && result.hidden === root.hidden && result.value === 2;
      },
      "Rejects non-composite roots": () =>
        [{}, [], Object.freeze({}), new Date(0), () => {}].every(root =>
          throws(() => Composite.rawSet(root, ["value"], 1))),
      "Rejects empty and non-array paths": () =>
        [[], "value", null, undefined, { 0: "value", length: 1 }].every(path =>
          throws(() => Composite.rawSet(Composite({}), path, 1))),
      "Rejects __proto__ at every path position": () =>
        [["__proto__"], ["__proto__", "value"], ["child", "__proto__", "value"]].every(path =>
          throws(() => Composite.rawSet(Composite({}), path, 1))),
      "Rejects unsupported and cyclic replacement values": () => {
        const cyclic = {};
        cyclic.self = cyclic;
        const root = Composite({ value: 1 });
        return [new Date(0), () => {}, cyclic].every(value =>
          throws(() => Composite.rawSet(root, ["value"], value))) && root.value === 1;
      },
    },

    "Set and transform lenses": {
      "set updates nested array elements": () => {
        const root = Composite({ users: [{ name: "Alice" }], keep: { value: 1 } });
        const result = Composite.set(root).users[0].name("Bob");
        return result.users[0].name === "Bob" && root.users[0].name === "Alice" &&
          result.keep === root.keep && Object.isFrozen(result.users[0]);
      },
      "set supports symbols and function-like property names": () => {
        const key = Symbol("lens key");
        return Composite.set(Composite({}))[key][""](2)[key][""] === 2 &&
          ["name", "length", "call", "apply", "then"].every(name =>
            Composite.set(Composite({}))[name](3)[name] === 3);
      },
      "set creates missing arrays": () =>
        Composite.set(Composite({})).items[0].value(2) === Composite({ items: [{ value: 2 }] }),
      "set accepts undefined and the deletion sentinel": () => {
        const root = Composite({ value: 1 });
        const result = Composite.set(root).value(undefined);
        return Object.hasOwn(result, "value") && result.value === undefined &&
          !Object.hasOwn(Composite.set(root).value(Composite.delete), "value");
      },
      "set clones values by default and consumes them when requested": () => {
        const value = { child: { marker: Symbol("set consume") } };
        const cloned = Composite.set(Composite({})).value(value);
        const mutable = !Object.isFrozen(value) && !Object.isFrozen(value.child);
        // A fresh marker avoids an existing canonical value replacing the consumed input.
        const consumed = { child: { marker: Symbol("set consume") } };
        const result = Composite.set(Composite({}), true).value(consumed);
        return cloned.value !== value && mutable && result.value === consumed && Object.isFrozen(consumed.child);
      },
      "transform receives the current frozen value exactly once": () => {
        const root = Composite({ user: { age: 20 }, keep: [1] });
        let calls = 0, received;
        const result = Composite.transform(root).user(value => {
          calls++;
          received = value;
          return { ...value, age: value.age + 1 };
        });
        return calls === 1 && received === root.user && Object.isFrozen(received) &&
          result.user.age === 21 && root.user.age === 20 && result.keep === root.keep;
      },
      "An identity transform reuses the root": () => {
        const root = Composite({ items: [1, 2] });
        return Composite.transform(root).items(value => value) === root;
      },
      "transform can initialize missing paths": () =>
        Composite.transform(Composite({})).user.age(value => (value ?? 0) + 1) ===
          Composite({ user: { age: 1 } }),
      "transform can delete a property": () =>
        !Object.hasOwn(Composite.transform(Composite({ value: 1 })).value(() => Composite.delete), "value"),
      "transform clones or consumes its returned value": () => {
        const root = Composite({ value: 1 });
        const value = { child: { marker: Symbol("transform clone") } };
        const cloned = Composite.transform(root).value(() => value);
        const consumed = { child: { marker: Symbol("transform consume") } };
        const result = Composite.transform(root, true).value(() => consumed);
        return cloned.value !== value && !Object.isFrozen(value.child) &&
          result.value === consumed && Object.isFrozen(consumed.child);
      },
      "set and transform require exactly one argument": () =>
        ["set", "transform"].every(name => {
          const root = Composite({ value: 1 });
          return throws(() => Composite[name](root).value()) &&
            throws(() => Composite[name](root).value(() => 2, 3));
        }),
      "transform rejects non-callable callbacks": () =>
        throws(() => Composite.transform(Composite({ value: 1 })).value(2)),
      "Callback errors propagate without changing the root": () => {
        const root = Composite({ value: 1 });
        const expected = new Error("callback failure");
        try {
          Composite.transform(root).value(() => { throw expected; });
          return false;
        } catch (error) {
          return error === expected && root.value === 1;
        }
      },
    },

    "Unsupported inputs and cycles": {
      "Unsupported types throw at the root and nested": () => {
        class Example { }
        if (!throws(() => Composite(new Date(0)))) return false;
        if (!throws(() => Composite({ value: new Date(0) }))) return false;
        if (!throws(() => Composite(function example() { }))) return false;
        if (!throws(() => Composite({ value: function example() { } }))) return false;
        if (!throws(() => Composite(new Map()))) return false;
        if (!throws(() => Composite({ value: new Map() }))) return false;
        if (!throws(() => Composite(new Set()))) return false;
        if (!throws(() => Composite({ value: new Set() }))) return false;
        if (!throws(() => Composite(new Uint8Array([1])))) return false;
        if (!throws(() => Composite({ value: new Uint8Array([1]) }))) return false;
        if (!throws(() => Composite(new Example()))) return false;
        return throws(() => Composite({ value: new Example() }));
      },
      "A failed clone leaves earlier input children mutable": () => {
        const child = { failedClone: 1 };
        const input = { child, invalid: new Date(0) };
        return throws(() => Composite(input)) && input.child === child &&
          !Object.isFrozen(input) && !Object.isFrozen(child);
      },
      "Direct cycles throw (clone)": () => {
        const input = {};
        input.self = input;
        return throws(() => Composite(input));
      },
      "Direct cycles throw (consume)": () => {
        const input = {};
        input.self = input;
        return throws(() => Composite(input, true));
      },
      "Indirect cycles throw (clone)": () => {
        const a = {};
        const b = { a };
        a.b = b;
        return throws(() => Composite(a));
      },
      "Indirect cycles throw (consume)": () => {
        const a = {};
        const b = { a };
        a.b = b;
        return throws(() => Composite(a, true));
      },
      "Symbol-keyed cycles throw": () => {
        const input = {};
        input[Symbol("cycle")] = input;
        return throws(() => Composite(input));
      },
      "Own __proto__ properties are rejected (clone)": () => {
        return throws(() => Composite(JSON.parse('{"__proto__": 1}')));
      },
      "Own __proto__ properties are rejected (consume)": () => {
        return throws(() => Composite(JSON.parse('{"__proto__": 1}'), true));
      },
    },

    "Numeric equality": {
      "{ value: -1 }: preserves the value and reuses an equal object": () => {
        const result = Composite({ value: -1 });
        return Object.is(result.value, -1) && Composite({ value: -1 }) === result;
      },
      "{ value: 0 }: preserves the value and reuses an equal object": () => {
        const result = Composite({ value: 0 });
        return Object.is(result.value, 0) && Composite({ value: 0 }) === result;
      },
      "{ value: 1 }: preserves the value and reuses an equal object": () => {
        const result = Composite({ value: 1 });
        return Object.is(result.value, 1) && Composite({ value: 1 }) === result;
      },
      "{ value: 0xFFFFFFFE }: preserves the value and reuses an equal object": () => {
        const result = Composite({ value: 0xFFFFFFFE });
        return Object.is(result.value, 0xFFFFFFFE) && Composite({ value: 0xFFFFFFFE }) === result;
      },
      "{ value: 0xFFFFFFFF }: preserves the value and reuses an equal object": () => {
        const result = Composite({ value: 0xFFFFFFFF });
        return Object.is(result.value, 0xFFFFFFFF) && Composite({ value: 0xFFFFFFFF }) === result;
      },
      "{ value: 0x100000000 }: preserves the value and reuses an equal object": () => {
        const result = Composite({ value: 0x100000000 });
        return Object.is(result.value, 0x100000000) && Composite({ value: 0x100000000 }) === result;
      },
      "{ value: 0x100000001 }: preserves the value and reuses an equal object": () => {
        const result = Composite({ value: 0x100000001 });
        return Object.is(result.value, 0x100000001) && Composite({ value: 0x100000001 }) === result;
      },
      "Uint32 boundary values remain distinct": () => {
        const results = new Set([
          Composite({ value: -1 }),
          Composite({ value: 0 }),
          Composite({ value: 1 }),
          Composite({ value: 0xFFFFFFFE }),
          Composite({ value: 0xFFFFFFFF }),
          Composite({ value: 0x100000000 }),
          Composite({ value: 0x100000001 }),
        ]);
        return results.size === 7;
      },
      "{ value: -1.5 }: preserves the value and reuses an equal object": () => {
        const result = Composite({ value: -1.5 });
        return Object.is(result.value, -1.5) && Composite({ value: -1.5 }) === result;
      },
      "{ value: 1.5 }: preserves the value and reuses an equal object": () => {
        const result = Composite({ value: 1.5 });
        return Object.is(result.value, 1.5) && Composite({ value: 1.5 }) === result;
      },
      "{ value: Number.MIN_VALUE }: preserves the value and reuses an equal object": () => {
        const result = Composite({ value: Number.MIN_VALUE });
