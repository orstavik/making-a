<!doctype html>
<meta charset="utf-8">
<title>Composite tests</title>
<h1>Composite tests</h1>
<p>Open the browser console for grouped results and the summary table.</p>
<script type="module">
  function runTests(tests) {
    function printTest({ test, passed, error }) {
      passed ?
        console.log("PASS —", test) :
        console.error("FAIL —", test, error || "Callback did not return true.");
    }

    function printGroup(group, results) {
      results.every(result => result.passed) ?
        console.groupCollapsed(group) :
        console.group(group);
      results.forEach(printTest);
      console.groupEnd();
    }

    const results = Object.entries(tests).map(([group, cases]) => {
      const groupResults = Object.entries(cases).map(([test, run]) => {
        try {
          return { test, passed: run() === true };
        } catch (caught) {
          return { test, error: String(caught) };
        }
      });
      printGroup(group, groupResults);
      return groupResults;
    }).flat();

    const failed = results.filter(result => !result.passed).length;
    console.log(`Tests finished: ${results.length - failed} passed, ${failed} failed.`);
    console.log(results);
  }

  import { Composite } from "../composite.js";

  function throws(run, ErrorType = TypeError) {
    try {
      run();
      return false;
    } catch (error) {
      return error instanceof ErrorType;
    }
  }

  const tests = {
    "Primitives": {
      "Supported primitives pass through and are registered": () =>
        [null, undefined, true, false, "Alice", 42, 1.5, 42n, 0, -0, NaN, Infinity, -Infinity, Symbol("local"), Symbol.for("")]
          .every(value => Object.is(Composite(value), value) && Composite.is(value)),
    },

    "Objects and children": {
      "Equal objects share a reference": () =>
        Composite({ name: "Alice" }) === Composite({ name: "Alice" }),
      "Different contents stay separate": () =>
        Composite({ name: "Alice" }) !== Composite({ name: "Bob" }),
      "An existing composite returns immediately": () => {
        const value = Composite({ name: "Alice" });
        return Composite.is(value) && Composite(value) === value;
      },
      "Equal children are shared across different parents": () => {
        const a = Composite({ id: 1, user: { name: "Alice" } });
        const b = Composite({ id: 2, user: { name: "Alice" } });
        return a !== b && a.user === b.user;
      },
      "An identical nested tree reuses its root": () =>
        Composite({ user: { name: "Alice" }, tags: ["js", "web"] }) ===
        Composite({ user: { name: "Alice" }, tags: ["js", "web"] }),
      "A shared child is not a cycle": () => {
        const child = { sharedChild: 1 };
        const result = Composite({ a: child, b: child });
        return result.a === result.b;
      },
      "Property order matters": () =>
        Composite({ a: 1, b: 2 }) !== Composite({ b: 2, a: 1 }),
      "Null-prototype data can reuse a plain object": () =>
        Composite(Object.assign(Object.create(null), { prototypeExample: 1 })) ===
        Composite({ prototypeExample: 1 }),
    },

    "Arrays": {
      "Equal arrays share a real array": () => {
        const a = Composite([1, 2, 3]);
        return Array.isArray(a) && Composite.is(a) && a === Composite([1, 2, 3]) && Composite(a) === a;
      },
      "Array order matters": () =>
        Composite(["js", "web"]) !== Composite(["web", "js"]),
      "A hole differs from explicit undefined": () =>
        Composite(new Array(1)) !== Composite([undefined]),
      "Sparse arrays preserve lengths and holes": () => {
        const a = Composite(new Array(3));
        const b = Composite(new Array(4));
        return a !== b && a.length === 3 && b.length === 4 && !(0 in a);
      },
      "Trailing holes survive cloning": () => {
        const input = [1];
        input.length = 4;
        const result = Composite(input);
        return result.length === 4 && !(3 in result) && result !== Composite([1]);
      },
    },

    "Cloning and freezing": {
      "Inputs and their children stay separate and mutable": () => {
        const child = { cloningExample: 1 };
        const input = { child };
        const result = Composite(input);
        return result !== input && result.child !== child && input.child === child &&
          !Object.isFrozen(input) && !Object.isFrozen(child) &&
          Object.isFrozen(result) && Object.isFrozen(result.child);
      },
      "Empty inputs are cloned without freezing them": () => {
        const input = {};
        return Composite(input) !== input && !Object.isFrozen(input);
      },
      "Writing to a frozen child throws": () => {
        const result = Composite({ user: { name: "Carol" } });
        return throws(() => { result.user.name = "Changed"; }) && result.user.name === "Carol";
      },
      "Frozen input data can be cloned": () => {
        const input = Object.freeze({ child: Object.freeze({ frozenExample: 1 }) });
        const result = Composite(input);
        return result !== input && result.child !== input.child &&
          Composite.is(result) && !Composite.is(input);
      },
      "Hidden property values are copied and participate in equality": () => {
        const child = { hiddenChild: 1 };
        const input = Object.defineProperty({ hiddenExample: 1 }, "hidden", { value: child });
        const result = Composite(input);
        return Object.hasOwn(result, "hidden") && result.hidden !== child &&
          Object.isFrozen(result.hidden) && !Object.isFrozen(child) &&
          result !== Composite({ hiddenExample: 1 });
      },
    },

    "Updates": {
      "Changed branches are replaced and untouched branches shared": () => {
        const before = Composite({ user: { name: "Alice" }, tags: ["js"] });
        const after = Composite({ ...before, user: { ...before.user, name: "Bob" } });
        return after !== before && after.user !== before.user && after.tags === before.tags &&
          before.user.name === "Alice" && after.user.name === "Bob";
      },
      "An equal update reuses its root": () => {
        const before = Composite({ user: { name: "Alice" } });
        return Composite({ ...before, user: { ...before.user } }) === before;
      },
    },

    "Unsupported inputs and cycles": {
      "Unsupported prototypes throw in both modes": () =>
        [Composite, Composite.consume].every(convert => throws(() => convert(new Date(0)))),
      "A failed clone leaves earlier input children mutable": () => {
        const child = { failedClone: 1 };
        const input = { child, invalid: new Date(0) };
        return throws(() => Composite(input)) && input.child === child &&
          !Object.isFrozen(input) && !Object.isFrozen(child);
      },
      "Direct cycles throw in both modes": () =>
        [Composite, Composite.consume].every(convert => {
          const input = {};
          input.self = input;
          return throws(() => convert(input));
        }),
      "Indirect cycles throw in both modes": () =>
        [Composite, Composite.consume].every(convert => {
          const a = {}, b = { a };
          a.b = b;
          return throws(() => convert(a));
        }),
      "Symbol-keyed cycles throw": () => {
        const input = {};
        input[Symbol("cycle")] = input;
        return throws(() => Composite(input));
      },
      "Own __proto__ properties are rejected in both modes": () =>
        [Composite, Composite.consume].every(convert =>
          throws(() => convert(JSON.parse('{"__proto__": 1}')))),
    },

    "Numeric equality": {
      "Signed zeros stay distinct": () =>
        Composite({ zero: 0 }) !== Composite({ zero: -0 }),
      "Infinity signs stay distinct": () =>
        Composite({ infinity: Infinity }) !== Composite({ infinity: -Infinity }),
      "NaNs share": () =>
        Composite({ number: NaN }) === Composite({ number: NaN }),
      "Different NaN bit patterns share": () => {
        const view = new DataView(new ArrayBuffer(8));
        view.setBigUint64(0, 0x7ff8000000000001n);
        const a = view.getFloat64(0);
        view.setBigUint64(0, 0xfff8000000000002n);
        const b = view.getFloat64(0);
        return Composite({ number: a }) === Composite({ number: b });
      },
    },

    "Symbols": {
      "Local, registered, empty-name and well-known symbols work as keys and values": () =>
        [Symbol("local"), Symbol.for("registered"), Symbol.for(""), Symbol.iterator].every(symbol =>
          Composite({ value: symbol }) === Composite({ value: symbol }) &&
          Composite({ [symbol]: 1 }) === Composite({ [symbol]: 1 })),
      "Different symbols with the same description remain distinct": () => {
        const a = Symbol("same"), b = Symbol("same");
        return Composite({ value: a }) !== Composite({ value: b }) &&
          Composite({ [a]: 1 }) !== Composite({ [b]: 1 });
      },
      "Signed zeros under symbol keys remain distinct": () => {
        const key = Symbol("zero");
        return Composite({ [key]: 0 }) !== Composite({ [key]: -0 });
      },
    },

    "Consume": {
      "Fresh inputs and children are reused and frozen": () => {
        const child = { consumeExample: Symbol("unique") };
        const input = { child };
        const result = Composite.consume(input);
        return result === input && result.child === child &&
          Object.isFrozen(input) && Object.isFrozen(child);
      },
      "Cached children replace equal input children": () => {
        const shared = Composite({ consumeShared: "Carol" });
        const original = { consumeShared: "Carol" };
        const input = { child: original };
        const result = Composite.consume(input);
        return input.child === shared && result.child === shared && !Object.isFrozen(original) && Object.isFrozen(shared);
      },
      "Shared children work with and without a cached equivalent": () =>
        [false, true].every(precache => {
          const marker = Symbol("consume alias");
          const cached = precache ? Composite({ marker }) : undefined;
          const child = { marker };
          const input = { a: child, b: { child } };
          const result = Composite.consume(input);
          return result === input && result.a === result.b.child &&
            result.a === (cached ?? child) && Object.isFrozen(child) === !precache &&
            Object.isFrozen(result.a) &&
            Object.isFrozen(result.b) && Object.isFrozen(result);
        }),
      "Sparse arrays and symbol-keyed children are reused and frozen": () => {
        const key = Symbol("array child");
        const child = { marker: Symbol("consume array") };
        const input = [child];
        input.length = 4;
        input[key] = child;
        const result = Composite.consume(input);
        return result === input && Array.isArray(result) && result.length === 4 &&
          !(1 in result) && !(3 in result) && result[0] === child &&
          result[key] === child && Object.isFrozen(child) && Object.isFrozen(result);
      },
      "Nested unregistered frozen objects are rejected": () => {
        const child = Object.freeze({ marker: Symbol("frozen child") });
        const input = { child };
        return throws(() => Composite.consume(input)) &&
          input.child === child && !Object.isFrozen(input) && !Composite.is(child);
      },
      "Read-only properties reject child replacement": () => {
        const marker = Symbol("read-only child");
        Composite({ marker });
        const child = { marker };
        const input = Object.defineProperty({}, "child", {
          value: child, enumerable: true, configurable: true, writable: false,
        });
        return throws(() => Composite.consume(input)) &&
          input.child === child && !Object.isFrozen(input) && !Object.isFrozen(child);
      },
      "A cached root may replace the input": () => {
        const shared = Composite({ consumeRoot: 1 });
        const input = { consumeRoot: 1 };
        return Composite.consume(input) === shared && !Object.isFrozen(input) && Object.isFrozen(shared);
      },
      "Unregistered frozen inputs are rejected": () =>
        throws(() => Composite.consume(Object.freeze({}))),
      "Existing composites are accepted": () => {
        const input = Composite({ existingConsume: 1 });
        return Composite.consume(input) === input;
      },
      "Errors may leave earlier children frozen": () => {
        const input = { child: { partialConsume: 1 }, invalid: new Date(0) };
        return throws(() => Composite.consume(input)) &&
          Object.isFrozen(input.child) && !Object.isFrozen(input);
      },
    },
  };

  console.log("Accessors, proxies, modified built-in prototypes, and garbage-collection timing are not covered.");
  runTests(tests);
</script>
