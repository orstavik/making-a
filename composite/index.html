<!doctype html>
<meta charset="utf-8">
<title>Composite tests</title>
<h1>Composite tests</h1>
<p>Open the browser console for grouped results and the summary table.</p>
<script type="module">
  function runTests(tests) {
    function printTest({ test, passed, error }) {
      passed ?
        console.log("PASS —", test) :
        console.error("FAIL —", test, error || "Callback did not return true.");
    }

    function printGroup(group, results) {
      results.every(result => result.passed) ?
        console.groupCollapsed(group) :
        console.group(group);
      results.forEach(printTest);
      console.groupEnd();
    }

    const results = Object.entries(tests).map(([group, cases]) => {
      const groupResults = Object.entries(cases).map(([test, run]) => {
        try {
          return { test, passed: run() === true };
        } catch (caught) {
          return { test, error: String(caught) };
        }
      });
      printGroup(group, groupResults);
      return groupResults;
    }).flat();

    const failed = results.filter(result => !result.passed).length;
    console.log(`Tests finished: ${results.length - failed} passed, ${failed} failed.`);
    console.log(results);
  }

  import { Composite, WeakHashMap } from "../composite.js";

  function throws(run, ErrorType = TypeError) {
    try {
      run();
      return false;
    } catch (error) {
      return error instanceof ErrorType;
    }
  }

  const tests = {
    "Primitives": {
      "Supported primitives pass through and are registered": () => {
        if (!Object.is(Composite(null), null)) return false;
        if (!Composite.is(null)) return false;
        if (!Object.is(Composite(undefined), undefined)) return false;
        if (!Composite.is(undefined)) return false;
        if (!Object.is(Composite(true), true)) return false;
        if (!Composite.is(true)) return false;
        if (!Object.is(Composite(false), false)) return false;
        if (!Composite.is(false)) return false;
        if (!Object.is(Composite("Alice"), "Alice")) return false;
        if (!Composite.is("Alice")) return false;
        if (!Object.is(Composite(42), 42)) return false;
        if (!Composite.is(42)) return false;
        if (!Object.is(Composite(1.5), 1.5)) return false;
        if (!Composite.is(1.5)) return false;
        if (!Object.is(Composite(42n), 42n)) return false;
        if (!Composite.is(42n)) return false;
        if (!Object.is(Composite(0), 0)) return false;
        if (!Composite.is(0)) return false;
        if (!Object.is(Composite(-0), -0)) return false;
        if (!Composite.is(-0)) return false;
        if (!Object.is(Composite(NaN), NaN)) return false;
        if (!Composite.is(NaN)) return false;
        if (!Object.is(Composite(Infinity), Infinity)) return false;
        if (!Composite.is(Infinity)) return false;
        if (!Object.is(Composite(-Infinity), -Infinity)) return false;
        if (!Composite.is(-Infinity)) return false;
        const local = Symbol("local");
        if (!Object.is(Composite(local), local)) return false;
        if (!Composite.is(local)) return false;
        const registered = Symbol.for("");
        if (!Object.is(Composite(registered), registered)) return false;
        return Composite.is(registered);
      },
    },

    "Type and property distinctions": {
      "Empty objects and arrays remain distinct (clone)": () => {
        return Composite({}) !== Composite([]);
      },
      "Empty objects and arrays remain distinct (consume)": () => {
        return Composite.consume({}) !== Composite.consume([]);
      },
      "Missing properties differ from explicit undefined (clone)": () => {
        const missing = Composite({});
        const present = Composite({ x: undefined });
        if (missing === present) return false;
        if (Object.hasOwn(missing, "x")) return false;
        if (!Object.hasOwn(present, "x")) return false;
        return present.x === undefined;
      },
      "Missing properties differ from explicit undefined (consume)": () => {
        const missing = Composite.consume({});
        const present = Composite.consume({ x: undefined });
        if (missing === present) return false;
        if (Object.hasOwn(missing, "x")) return false;
        if (!Object.hasOwn(present, "x")) return false;
        return present.x === undefined;
      },
      "Primitive types remain distinct inside objects (clone)": () => {
        const number = Composite({ value: 1 });
        if (!Object.is(number.value, 1)) return false;
        if (Composite({ value: 1 }) !== number) return false;
        const string = Composite({ value: "1" });
        if (!Object.is(string.value, "1")) return false;
        if (Composite({ value: "1" }) !== string) return false;
        const bigint = Composite({ value: 1n });
        if (!Object.is(bigint.value, 1n)) return false;
        if (Composite({ value: 1n }) !== bigint) return false;
        const nil = Composite({ value: null });
        if (!Object.is(nil.value, null)) return false;
        if (Composite({ value: null }) !== nil) return false;
        const missing = Composite({ value: undefined });
        if (!Object.is(missing.value, undefined)) return false;
        if (Composite({ value: undefined }) !== missing) return false;
        const no = Composite({ value: false });
        if (!Object.is(no.value, false)) return false;
        if (Composite({ value: false }) !== no) return false;
        const yes = Composite({ value: true });
        if (!Object.is(yes.value, true)) return false;
        if (Composite({ value: true }) !== yes) return false;
        const zero = Composite({ value: 0 });
        if (!Object.is(zero.value, 0)) return false;
        if (Composite({ value: 0 }) !== zero) return false;
        const empty = Composite({ value: "" });
        if (!Object.is(empty.value, "")) return false;
        if (Composite({ value: "" }) !== empty) return false;
        return new Set([number, string, bigint, nil, missing, no, yes, zero, empty]).size === 9;
      },
      "Primitive types remain distinct inside objects (consume)": () => {
        const number = Composite.consume({ value: 1 });
        if (!Object.is(number.value, 1)) return false;
        if (Composite.consume({ value: 1 }) !== number) return false;
        const string = Composite.consume({ value: "1" });
        if (!Object.is(string.value, "1")) return false;
        if (Composite.consume({ value: "1" }) !== string) return false;
        const bigint = Composite.consume({ value: 1n });
        if (!Object.is(bigint.value, 1n)) return false;
        if (Composite.consume({ value: 1n }) !== bigint) return false;
        const nil = Composite.consume({ value: null });
        if (!Object.is(nil.value, null)) return false;
        if (Composite.consume({ value: null }) !== nil) return false;
        const missing = Composite.consume({ value: undefined });
        if (!Object.is(missing.value, undefined)) return false;
        if (Composite.consume({ value: undefined }) !== missing) return false;
        const no = Composite.consume({ value: false });
        if (!Object.is(no.value, false)) return false;
        if (Composite.consume({ value: false }) !== no) return false;
        const yes = Composite.consume({ value: true });
        if (!Object.is(yes.value, true)) return false;
        if (Composite.consume({ value: true }) !== yes) return false;
        const zero = Composite.consume({ value: 0 });
        if (!Object.is(zero.value, 0)) return false;
        if (Composite.consume({ value: 0 }) !== zero) return false;
        const empty = Composite.consume({ value: "" });
        if (!Object.is(empty.value, "")) return false;
        if (Composite.consume({ value: "" }) !== empty) return false;
        return new Set([number, string, bigint, nil, missing, no, yes, zero, empty]).size === 9;
      },
    },

    "Objects and children": {
      "Equal objects share a reference": () =>
        Composite({ name: "Alice" }) === Composite({ name: "Alice" }),
      "Different contents stay separate": () =>
        Composite({ name: "Alice" }) !== Composite({ name: "Bob" }),
      "An existing composite returns immediately": () => {
        const value = Composite({ name: "Alice" });
        return Composite.is(value) && Composite(value) === value;
      },
      "Equal children are shared across different parents": () => {
        const a = Composite({ id: 1, user: { name: "Alice" } });
        const b = Composite({ id: 2, user: { name: "Alice" } });
        return a !== b && a.user === b.user;
      },
      "An identical nested tree reuses its root": () =>
        Composite({ user: { name: "Alice" }, tags: ["js", "web"] }) ===
        Composite({ user: { name: "Alice" }, tags: ["js", "web"] }),
      "A shared child is not a cycle": () => {
        const child = { sharedChild: 1 };
        const result = Composite({ a: child, b: child });
        return result.a === result.b;
      },
      "Property order matters": () =>
        Composite({ a: 1, b: 2 }) !== Composite({ b: 2, a: 1 }),
      "Null-prototype data can reuse a plain object": () =>
        Composite(Object.assign(Object.create(null), { prototypeExample: 1 })) ===
        Composite({ prototypeExample: 1 }),
    },

    "Arrays": {
      "Equal arrays share a real array": () => {
        const a = Composite([1, 2, 3]);
        return Array.isArray(a) && Composite.is(a) && a === Composite([1, 2, 3]) && Composite(a) === a;
      },
      "Array order matters": () =>
        Composite(["js", "web"]) !== Composite(["web", "js"]),
      "A hole differs from explicit undefined": () =>
        Composite(new Array(1)) !== Composite([undefined]),
      "Sparse arrays preserve lengths and holes": () => {
        const a = Composite(new Array(3));
        const b = Composite(new Array(4));
        return a !== b && a.length === 3 && b.length === 4 && !(0 in a);
      },
      "Trailing holes survive cloning": () => {
        const input = [1];
        input.length = 4;
        const result = Composite(input);
        return result.length === 4 && !(3 in result) && result !== Composite([1]);
      },
    },

    "Cloning and freezing": {
      "Inputs and their children stay separate and mutable": () => {
        const child = { cloningExample: 1 };
        const input = { child };
        const result = Composite(input);
        return result !== input && result.child !== child && input.child === child &&
          !Object.isFrozen(input) && !Object.isFrozen(child) &&
          Object.isFrozen(result) && Object.isFrozen(result.child);
      },
      "Empty inputs are cloned without freezing them": () => {
        const input = {};
        return Composite(input) !== input && !Object.isFrozen(input);
      },
      "Writing to a frozen child throws": () => {
        const result = Composite({ user: { name: "Carol" } });
        return throws(() => { result.user.name = "Changed"; }) && result.user.name === "Carol";
      },
      "Frozen input data can be cloned": () => {
        const input = Object.freeze({ child: Object.freeze({ frozenExample: 1 }) });
        const result = Composite(input);
        return result !== input && result.child !== input.child &&
          Composite.is(result) && !Composite.is(input);
      },
      "Hidden property values are copied and participate in equality": () => {
        const child = { hiddenChild: 1 };
        const input = Object.defineProperty({ hiddenExample: 1 }, "hidden", { value: child });
        const result = Composite(input);
        return Object.hasOwn(result, "hidden") && result.hidden !== child &&
          Object.isFrozen(result.hidden) && !Object.isFrozen(child) &&
          result !== Composite({ hiddenExample: 1 });
      },
    },

    "Updates": {
      "Changed branches are replaced and untouched branches shared": () => {
        const before = Composite({ user: { name: "Alice" }, tags: ["js"] });
        const after = Composite({ ...before, user: { ...before.user, name: "Bob" } });
        return after !== before && after.user !== before.user && after.tags === before.tags &&
          before.user.name === "Alice" && after.user.name === "Bob";
      },
      "An equal update reuses its root": () => {
        const before = Composite({ user: { name: "Alice" } });
        return Composite({ ...before, user: { ...before.user } }) === before;
      },
    },

    "Unsupported inputs and cycles": {
      "Unsupported types throw at the root and nested (clone)": () => {
        class Example {}
        if (!throws(() => Composite(new Date(0)))) return false;
        if (!throws(() => Composite({ value: new Date(0) }))) return false;
        if (!throws(() => Composite(function example() {}))) return false;
        if (!throws(() => Composite({ value: function example() {} }))) return false;
        if (!throws(() => Composite(new Map()))) return false;
        if (!throws(() => Composite({ value: new Map() }))) return false;
        if (!throws(() => Composite(new Set()))) return false;
        if (!throws(() => Composite({ value: new Set() }))) return false;
        if (!throws(() => Composite(new Uint8Array([1])))) return false;
        if (!throws(() => Composite({ value: new Uint8Array([1]) }))) return false;
        if (!throws(() => Composite(new Example()))) return false;
        return throws(() => Composite({ value: new Example() }));
      },
      "Unsupported types throw at the root and nested (consume)": () => {
        class Example {}
        if (!throws(() => Composite.consume(new Date(0)))) return false;
        if (!throws(() => Composite.consume({ value: new Date(0) }))) return false;
        if (!throws(() => Composite.consume(function example() {}))) return false;
        if (!throws(() => Composite.consume({ value: function example() {} }))) return false;
        if (!throws(() => Composite.consume(new Map()))) return false;
        if (!throws(() => Composite.consume({ value: new Map() }))) return false;
        if (!throws(() => Composite.consume(new Set()))) return false;
        if (!throws(() => Composite.consume({ value: new Set() }))) return false;
        if (!throws(() => Composite.consume(new Uint8Array([1])))) return false;
        if (!throws(() => Composite.consume({ value: new Uint8Array([1]) }))) return false;
        if (!throws(() => Composite.consume(new Example()))) return false;
        return throws(() => Composite.consume({ value: new Example() }));
      },
      "A failed clone leaves earlier input children mutable": () => {
        const child = { failedClone: 1 };
        const input = { child, invalid: new Date(0) };
        return throws(() => Composite(input)) && input.child === child &&
          !Object.isFrozen(input) && !Object.isFrozen(child);
      },
      "Direct cycles throw (clone)": () => {
        const input = {};
        input.self = input;
        return throws(() => Composite(input));
      },
      "Direct cycles throw (consume)": () => {
        const input = {};
        input.self = input;
        return throws(() => Composite.consume(input));
      },
      "Indirect cycles throw (clone)": () => {
        const a = {};
        const b = { a };
        a.b = b;
        return throws(() => Composite(a));
      },
      "Indirect cycles throw (consume)": () => {
        const a = {};
        const b = { a };
        a.b = b;
        return throws(() => Composite.consume(a));
      },
      "Symbol-keyed cycles throw": () => {
        const input = {};
        input[Symbol("cycle")] = input;
        return throws(() => Composite(input));
      },
      "Own __proto__ properties are rejected (clone)": () => {
        return throws(() => Composite(JSON.parse('{"__proto__": 1}')));
      },
      "Own __proto__ properties are rejected (consume)": () => {
        return throws(() => Composite.consume(JSON.parse('{"__proto__": 1}')));
      },
    },

    "Numeric equality": {
      "-1: value is preserved and equal objects share": () => {
        const result = Composite({ value: -1 });
        return Object.is(result.value, -1) &&
          Composite({ value: -1 }) === result;
      },
      "0: value is preserved and equal objects share": () => {
        const result = Composite({ value: 0 });
        return Object.is(result.value, 0) &&
          Composite({ value: 0 }) === result;
      },
      "1: value is preserved and equal objects share": () => {
        const result = Composite({ value: 1 });
        return Object.is(result.value, 1) &&
          Composite({ value: 1 }) === result;
      },
      "Uint32 maximum minus one: value is preserved and equal objects share": () => {
        const result = Composite({ value: 0xFFFFFFFE });
        return Object.is(result.value, 0xFFFFFFFE) &&
          Composite({ value: 0xFFFFFFFE }) === result;
      },
      "Uint32 maximum: value is preserved and equal objects share": () => {
        const result = Composite({ value: 0xFFFFFFFF });
        return Object.is(result.value, 0xFFFFFFFF) &&
          Composite({ value: 0xFFFFFFFF }) === result;
      },
      "Uint32 maximum plus one: value is preserved and equal objects share": () => {
        const result = Composite({ value: 0x100000000 });
        return Object.is(result.value, 0x100000000) &&
          Composite({ value: 0x100000000 }) === result;
      },
      "Uint32 maximum plus two: value is preserved and equal objects share": () => {
        const result = Composite({ value: 0x100000001 });
        return Object.is(result.value, 0x100000001) &&
          Composite({ value: 0x100000001 }) === result;
      },
      "Uint32 boundary values remain distinct": () => {
        const results = new Set([
          Composite({ value: -1 }),
          Composite({ value: 0 }),
          Composite({ value: 1 }),
          Composite({ value: 0xFFFFFFFE }),
          Composite({ value: 0xFFFFFFFF }),
          Composite({ value: 0x100000000 }),
          Composite({ value: 0x100000001 }),
        ]);
        return results.size === 7;
      },
      "Negative fractions: value is preserved and equal objects share": () => {
        const result = Composite({ value: -1.5 });
        return Object.is(result.value, -1.5) &&
          Composite({ value: -1.5 }) === result;
      },
      "Positive fractions: value is preserved and equal objects share": () => {
        const result = Composite({ value: 1.5 });
        return Object.is(result.value, 1.5) &&
          Composite({ value: 1.5 }) === result;
      },
      "Smallest positive number: value is preserved and equal objects share": () => {
        const result = Composite({ value: Number.MIN_VALUE });
        return Object.is(result.value, Number.MIN_VALUE) &&
          Composite({ value: Number.MIN_VALUE }) === result;
      },
      "Smallest negative magnitude: value is preserved and equal objects share": () => {
        const result = Composite({ value: -Number.MIN_VALUE });
        return Object.is(result.value, -Number.MIN_VALUE) &&
          Composite({ value: -Number.MIN_VALUE }) === result;
      },
      "Largest positive finite number: value is preserved and equal objects share": () => {
        const result = Composite({ value: Number.MAX_VALUE });
        return Object.is(result.value, Number.MAX_VALUE) &&
          Composite({ value: Number.MAX_VALUE }) === result;
      },
      "Largest negative finite magnitude: value is preserved and equal objects share": () => {
        const result = Composite({ value: -Number.MAX_VALUE });
        return Object.is(result.value, -Number.MAX_VALUE) &&
          Composite({ value: -Number.MAX_VALUE }) === result;
      },
      "Maximum safe integer: value is preserved and equal objects share": () => {
        const result = Composite({ value: Number.MAX_SAFE_INTEGER });
        return Object.is(result.value, Number.MAX_SAFE_INTEGER) &&
          Composite({ value: Number.MAX_SAFE_INTEGER }) === result;
      },
      "Fractions and extreme finite values remain distinct": () => {
        const results = new Set([
          Composite({ value: -1.5 }),
          Composite({ value: 1.5 }),
          Composite({ value: Number.MIN_VALUE }),
          Composite({ value: -Number.MIN_VALUE }),
          Composite({ value: Number.MAX_VALUE }),
          Composite({ value: -Number.MAX_VALUE }),
          Composite({ value: Number.MAX_SAFE_INTEGER }),
        ]);
        return results.size === 7;
      },
      "Signed zeros stay distinct": () =>
        Composite({ zero: 0 }) !== Composite({ zero: -0 }),
      "Infinity signs stay distinct": () =>
        Composite({ infinity: Infinity }) !== Composite({ infinity: -Infinity }),
      "NaNs share": () =>
        Composite({ number: NaN }) === Composite({ number: NaN }),
      "Different NaN bit patterns share": () => {
        const view = new DataView(new ArrayBuffer(8));
        view.setBigUint64(0, 0x7ff8000000000001n);
        const a = view.getFloat64(0);
        view.setBigUint64(0, 0xfff8000000000002n);
        const b = view.getFloat64(0);
        return Composite({ number: a }) === Composite({ number: b });
      },
    },

    "Strings": {
      "Empty, Unicode and embedded-null values preserve contents and reuse (clone)": () => {
        const empty = Composite({ value: "" });
        if (!Object.is(empty.value, "")) return false;
        if (Composite({ value: "" }) !== empty) return false;
        const letter = Composite({ value: "a" });
        if (!Object.is(letter.value, "a")) return false;
        if (Composite({ value: "a" }) !== letter) return false;
        const emoji = Composite({ value: "😀" });
        if (!Object.is(emoji.value, "😀")) return false;
        if (Composite({ value: "😀" }) !== emoji) return false;
        const otherEmoji = Composite({ value: "😁" });
        if (!Object.is(otherEmoji.value, "😁")) return false;
        if (Composite({ value: "😁" }) !== otherEmoji) return false;
        const surrogate = Composite({ value: "\uD83D" });
        if (!Object.is(surrogate.value, "\uD83D")) return false;
        if (Composite({ value: "\uD83D" }) !== surrogate) return false;
        const nul = Composite({ value: "\0" });
        if (!Object.is(nul.value, "\0")) return false;
        if (Composite({ value: "\0" }) !== nul) return false;
        const embeddedNul = Composite({ value: "a\0b" });
        if (!Object.is(embeddedNul.value, "a\0b")) return false;
        if (Composite({ value: "a\0b" }) !== embeddedNul) return false;
        const plain = Composite({ value: "ab" });
        if (!Object.is(plain.value, "ab")) return false;
        if (Composite({ value: "ab" }) !== plain) return false;
        return new Set([empty, letter, emoji, otherEmoji, surrogate, nul, embeddedNul, plain]).size === 8;
      },
      "Empty, Unicode and embedded-null values preserve contents and reuse (consume)": () => {
        const empty = Composite.consume({ value: "" });
        if (!Object.is(empty.value, "")) return false;
        if (Composite.consume({ value: "" }) !== empty) return false;
        const letter = Composite.consume({ value: "a" });
        if (!Object.is(letter.value, "a")) return false;
        if (Composite.consume({ value: "a" }) !== letter) return false;
        const emoji = Composite.consume({ value: "😀" });
        if (!Object.is(emoji.value, "😀")) return false;
        if (Composite.consume({ value: "😀" }) !== emoji) return false;
        const otherEmoji = Composite.consume({ value: "😁" });
        if (!Object.is(otherEmoji.value, "😁")) return false;
        if (Composite.consume({ value: "😁" }) !== otherEmoji) return false;
        const surrogate = Composite.consume({ value: "\uD83D" });
        if (!Object.is(surrogate.value, "\uD83D")) return false;
        if (Composite.consume({ value: "\uD83D" }) !== surrogate) return false;
        const nul = Composite.consume({ value: "\0" });
        if (!Object.is(nul.value, "\0")) return false;
        if (Composite.consume({ value: "\0" }) !== nul) return false;
        const embeddedNul = Composite.consume({ value: "a\0b" });
        if (!Object.is(embeddedNul.value, "a\0b")) return false;
        if (Composite.consume({ value: "a\0b" }) !== embeddedNul) return false;
        const plain = Composite.consume({ value: "ab" });
        if (!Object.is(plain.value, "ab")) return false;
        if (Composite.consume({ value: "ab" }) !== plain) return false;
        return new Set([empty, letter, emoji, otherEmoji, surrogate, nul, embeddedNul, plain]).size === 8;
      },
      "Empty, Unicode and embedded-null property keys remain distinct (clone)": () => {
        const empty = Composite({ [""]: 1 });
        if (!Object.hasOwn(empty, "")) return false;
        if (empty[""] !== 1) return false;
        if (Composite({ [""]: 1 }) !== empty) return false;
        const emoji = Composite({ ["😀"]: 1 });
        if (!Object.hasOwn(emoji, "😀")) return false;
        if (emoji["😀"] !== 1) return false;
        if (Composite({ ["😀"]: 1 }) !== emoji) return false;
        const otherEmoji = Composite({ ["😁"]: 1 });
        if (!Object.hasOwn(otherEmoji, "😁")) return false;
        if (otherEmoji["😁"] !== 1) return false;
        if (Composite({ ["😁"]: 1 }) !== otherEmoji) return false;
        const nul = Composite({ ["\0"]: 1 });
        if (!Object.hasOwn(nul, "\0")) return false;
        if (nul["\0"] !== 1) return false;
        if (Composite({ ["\0"]: 1 }) !== nul) return false;
        const embeddedNul = Composite({ ["a\0b"]: 1 });
        if (!Object.hasOwn(embeddedNul, "a\0b")) return false;
        if (embeddedNul["a\0b"] !== 1) return false;
        if (Composite({ ["a\0b"]: 1 }) !== embeddedNul) return false;
        const plain = Composite({ ["ab"]: 1 });
        if (!Object.hasOwn(plain, "ab")) return false;
        if (plain["ab"] !== 1) return false;
        if (Composite({ ["ab"]: 1 }) !== plain) return false;
        return new Set([empty, emoji, otherEmoji, nul, embeddedNul, plain]).size === 6;
      },
      "Empty, Unicode and embedded-null property keys remain distinct (consume)": () => {
        const empty = Composite.consume({ [""]: 1 });
        if (!Object.hasOwn(empty, "")) return false;
        if (empty[""] !== 1) return false;
        if (Composite.consume({ [""]: 1 }) !== empty) return false;
        const emoji = Composite.consume({ ["😀"]: 1 });
